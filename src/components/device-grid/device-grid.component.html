
<div class="bg-slate-800 rounded-xl shadow-lg p-6">
  <h2 class="text-2xl font-semibold text-white mb-4">Dispositivos Conectados</h2>
  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
    @for (device of devices(); track device.deviceId) {
      <app-device-card 
        [device]="device" 
        [isSelected]="device.deviceId === selectedDeviceId()"
        (click)="onSelectDevice(device)">
      </app-device-card>
    }
  </div>
</div>
